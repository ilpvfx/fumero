[project]
name = "fumero"
version = "0.0.1"
description = "Generate a Fumadocs API reference from a Python module."
readme = "README.md"
authors = [
  { name = "Ludvig Holmkvist", email = "ludvig.holmkvist@ilpvfx.com" }
]
requires-python = ">=3.11"
dependencies = [
    "griffe>=2.1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.0",
  "ty>=0.0.63",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
fumero = "fumero.tools.fumero:main"

[tool.ruff]
line-length = 100
