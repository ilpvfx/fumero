[project]
name = "fumero"
version = "0.2.0"
description = "Generate a Fumadocs API reference from a Python module."
readme = "README.md"
authors = [
  { name = "Fredrik Brännbacka", email = "fredrik.brannbacka@ilpvfx.com" },
  { name = "Ludvig Holmkvist", email = "ludvig.holmkvist@ilpvfx.com" },
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["api-reference", "documentation", "mdx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]
dependencies = [
  "griffe>=2.1.0",
  "jinja2>=3.1.6",
]

[project.urls]
Documentation = "https://ilpvfx.github.io/fumero/"
Repository = "https://github.com/ilpvfx/fumero"
Changelog = "https://ilpvfx.github.io/fumero/changelog/"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.0",
  "ty>=0.0.63",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
fumero = "fumero.tools.fumero:main"

[tool.fumero]
base-url = "/api"
clean = true
output = "docs/content/docs/api"
with-meta = true

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
