name: Docs

on:
  workflow_call:
  workflow_dispatch:

# one site, so a manual run and a release cannot deploy over each other. queued rather than
# cancelled: the later of the two is the one that should win, and it needs its turn to run.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build the site
        run: npm run build
        working-directory: docs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # next writes its assets under `_next`, and anything starting with an underscore is invisible
      # to jekyll. this file is what tells pages not to run it.
      - name: Disable Jekyll
        run: touch out/.nojekyll
        working-directory: docs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
