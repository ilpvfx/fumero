name: Release

on:
  push:
    branches:
      - _

# allow a later push to the same ref to cancel the jobs still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # opens a release pull request collecting the commits since the last tag, and tags a release when
  # that pull request is merged. everything below runs on the merge, so the checkout already holds
  # the bumped version and the written changelog.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # the token trusted publishing exchanges for its credentials, so no api token is stored
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build distributions
        run: uv build

      - name: Upload wheel to GitHub release
        run: gh release upload "${{ needs.release-please.outputs.tag-name }}" dist/*.whl

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yaml
